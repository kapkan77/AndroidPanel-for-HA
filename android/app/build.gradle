plugins { id 'com.android.application' }

android {
    namespace 'local.home.hmi'
    compileSdk 35
    defaultConfig {
        applicationId 'local.home.hmi'
        minSdk 26
        targetSdk 30
        versionCode 6
        versionName '1.3.0'
    }
    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../src']
            res.srcDirs = ['../res']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
